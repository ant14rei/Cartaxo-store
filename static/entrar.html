<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Entrar · Cartaxo Store</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230A0B0D'/%3E%3Cpath fill='%23fff' d='M79 16 L40 16 C30 16 26 20 24 29 L15 70 C13 80 17 84 27 84 L76 84 L79 70 L38 70 C35 70 34 68 35 65 L41 35 C42 31 44 30 47 30 L76 30 Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
:root{--bg:#FFFFFF;--ink:#0A0B0D;--ink-2:#525A64;--line:#E2E6EB;--surface:#F3F5F8;--blue:#1D9BF0;--on-ink:#FFFFFF;--err:#B3261E;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0C0E;--ink:#F3F5F7;--ink-2:#A7AFB9;--line:#24282E;--surface:#14171B;--blue:#3AA9F5;--on-ink:#0B0C0E;--err:#F2B8B5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0C0E;--ink:#F3F5F7;--ink-2:#A7AFB9;--line:#24282E;--surface:#14171B;--blue:#3AA9F5;--on-ink:#0B0C0E;--err:#F2B8B5;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:380px;display:grid;gap:18px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:40px;height:40px;color:var(--ink)}
.logo b{font-stretch:125%;font-weight:850;font-size:20px;letter-spacing:.02em;text-transform:uppercase}
h1{font-stretch:118%;font-weight:850;font-size:26px;margin:0}
p{margin:0;color:var(--ink-2)}
form{display:grid;gap:12px;border:1px solid var(--line);border-radius:18px;padding:20px}
label{font-size:13px;font-weight:650;color:var(--ink-2)}
input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
button{border:0;border-radius:999px;padding:13px;font:inherit;font-weight:700;font-size:15px;background:var(--ink);color:var(--on-ink);cursor:pointer;margin-top:4px}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.erro{color:var(--err);background:color-mix(in srgb,var(--err) 12%,transparent);border-radius:10px;padding:10px 12px;font-size:14px}
a{color:var(--ink-2);font-size:14px}
</style>
</head>
<body>
<main>
  <div class="logo"><svg viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M79 16 L40 16 C30 16 26 20 24 29 L15 70 C13 80 17 84 27 84 L76 84 L79 70 L38 70 C35 70 34 68 35 65 L41 35 C42 31 44 30 47 30 L76 30 Z"/><path d="M84 4.5 L86.9 7.18 L90.75 6.31 L91.92 10.08 L95.69 11.25 L94.82 15.1 L97.5 18 L94.82 20.9 L95.69 24.75 L91.92 25.92 L90.75 29.69 L86.9 28.82 L84 31.5 L81.1 28.82 L77.25 29.69 L76.08 25.92 L72.31 24.75 L73.18 20.9 L70.5 18 L73.18 15.1 L72.31 11.25 L76.08 10.08 L77.25 6.31 L81.1 7.18Z" fill="var(--blue)"/><path d="M78.6 18.4 L82.4 22.2 L89.6 14.2" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Cartaxo</b></div>
  <div><h1>Painel da loja</h1><p>Entre com o e-mail e a senha cadastrados no Railway.</p></div>
  <!--AVISO-->
  <form method="post" action="/entrar" autocomplete="on">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required minlength="8">
    <button type="submit">Entrar</button>
  </form>
  <a href="/">Voltar ao site</a>
</main>
<script>try{var t=localStorage.getItem("cartaxo-tema");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
</body>
</html>
